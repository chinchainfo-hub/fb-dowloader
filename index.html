<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Downloader Pro</title>
    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #1e293b;
            --bg: #0f172a;
            --success: #22c55e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--secondary);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
            color: var(--primary);
        }

        .results-area {
            margin-top: 25px;
        }

        .video-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
            display: block;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .dl-btn {
            display: block;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .dl-btn.sd {
            background-color: #64748b;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FB Downloader</h1>
        <p class="subtitle">Descarga videos de Facebook en HD/SD</p>

        <input type="text" id="videoUrl" placeholder="Pega el link de Facebook aquí...">
        <button id="mainBtn" onclick="obtenerVideo()">Descargar ahora</button>

        <div id="status"></div>
        <div id="results" class="results-area"></div>

        <div class="footer">
            Powered by Vercel & Facebook17 API
        </div>
    </div>

    <script>
        async function obtenerVideo() {
            const input = document.getElementById('videoUrl');
            const urlValue = input.value.trim();
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const btn = document.getElementById('mainBtn');

            if (!urlValue) {
                status.innerText = "Error: Pega un enlace primero.";
                status.style.color = "#ef4444";
                return;
            }

            // Preparar UI
            status.innerText = "Consultando con la API...";
            status.style.color = "#38bdf8";
            results.innerHTML = "";
            btn.disabled = true;

            try {
                // Llamada a tu servidor en Vercel
                const response = await fetch(`/api/download?url=${encodeURIComponent(urlValue)}`);
                const data = await response.json();

                // Analizar la respuesta según el formato de facebook17
                if (data && (data.hd || data.sd)) {
                    status.innerText = "¡Video listo para descargar!";
                    let html = "";
                    
                    if (data.title) {
                        html += `<span class="video-title">🎥 ${data.title}</span>`;
                    }
                    
                    if (data.hd) {
                        html += `<a href="${data.hd}" class="dl-btn" target="_blank">DESCARGAR CALIDAD HD</a>`;
                    }
                    
                    if (data.sd) {
                        html += `<a href="${data.sd}" class="dl-btn sd" target="_blank">DESCARGAR CALIDAD SD</a>`;
                    }
                    
                    results.innerHTML = html;
                } else {
                    status.style.color = "#ef4444";
                    status.innerText = "Error: No se encontraron enlaces (¿Es un video público?)";
                    console.log("Respuesta de la API:", data);
                }

            } catch (error) {
                status.style.color = "#ef4444";
                status.innerText = "Error crítico de conexión.";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        // Ejecutar con la tecla Enter
        document.getElementById('videoUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') obtenerVideo();
        });
    </script>
</body>
</html>
