<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Downloader - Fixed</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --success: #22c55e; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; font-size: 14px; color: var(--primary); }
        .thumbnail { width: 100%; border-radius: 10px; margin: 20px 0; display: none; border: 1px solid var(--primary); }
        .dl-btn { display: block; background: var(--success); color: white; text-decoration: none; padding: 15px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FB Downloader</h1>
        <input type="text" id="videoUrl" placeholder="Pega el link aquí...">
        <button onclick="obtenerVideo()">OBTENER VIDEO</button>
        
        <div id="status"></div>
        <img id="thumb" class="thumbnail">
        <div id="results"></div>
    </div>

    <script>
        async function obtenerVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const status = document.getElementById('status');
            const thumb = document.getElementById('thumb');
            const results = document.getElementById('results');

            if(!url) return alert("Pega una URL");

            status.innerText = "Procesando respuesta...";
            results.innerHTML = "";
            thumb.style.display = "none";

            try {
                const response = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                // LOGICA DE ESCANEO PARA EL FORMATO QUE VISTE EN CONSOLA
                let videoData = Array.isArray(data) ? data[0] : data;

                if (videoData && videoData.urls) {
                    // Mostrar imagen si existe
                    if (videoData.pictureUrl) {
                        thumb.src = videoData.pictureUrl;
                        thumb.style.display = "block";
                    }

                    // Generar botones para cada URL encontrada
                    videoData.urls.forEach((item, index) => {
                        const calidad = item.subname ? item.subname.toUpperCase() : `Opción ${index + 1}`;
                        const linkHtml = `<a href="${item.url}" class="dl-btn" target="_blank">DESCARGAR ${calidad}</a>`;
                        results.innerHTML += linkHtml;
                    });

                    status.innerText = "¡Video encontrado!";
                } else {
                    status.innerText = "No se encontraron links. Revisa la consola (F12).";
                    console.log("Datos recibidos pero no procesados:", data);
                }
            } catch (err) {
                status.innerText = "Error de conexión.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
